# Non-secret Cloud Run environment. Copy to deploy/env.yaml (git-ignored) and fill in.
# Secrets are NOT set here; they are mapped from Secret Manager with --set-secrets.
APP_MODE: "production"
DRY_RUN: "false"
LOG_LEVEL: "info"
PUBLIC_BASE_URL: "https://fireflies-chat-recaps-PROJECT_NUMBER.us-west1.run.app"
GOOGLE_CLOUD_PROJECT: "your-project-id"
GOOGLE_AUTHORIZED_USER_EMAIL: "you@orcarehab.com"
GOOGLE_OAUTH_CLIENT_ID: "1234567890-abc.apps.googleusercontent.com"
GOOGLE_CHAT_SPACE: "spaces/AAAAxxxxxxx"
REFRESH_TOKEN_SECRET_ID: "google-chat-refresh-token"
FIRESTORE_DATABASE_ID: "(default)"
FIRESTORE_COLLECTION_PREFIX: "ff_recaps_"
TASKS_LOCATION: "us-west1"
TASKS_QUEUE: "fireflies-recaps"
TASKS_INVOKER_SERVICE_ACCOUNT: "ff-recaps-tasks@your-project-id.iam.gserviceaccount.com"
TASKS_MAX_ATTEMPTS: "20"
# Default "[]" posts nothing. Start with one narrow rule for the end-to-end test.
MEETING_RULES: '[{"name":"e2e-test","organizerEmails":["you@orcarehab.com"],"titleContains":["Recap Bot Test"]}]'
